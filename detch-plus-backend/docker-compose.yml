version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: mysql_detchplus
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: detchplus
      MYSQL_USER: DP_USER
      MYSQL_PASSWORD: root123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
    networks:
      - detchplus_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

volumes:
  mysql_data:

networks:
  detchplus_network:
    driver: bridge